services:
  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
  engine:
    build: ./services/engine
    ports:
      - "8081:8081"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowmation
      POSTGRES_USER: flowmation
      POSTGRES_PASSWORD: flowmation_local
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
